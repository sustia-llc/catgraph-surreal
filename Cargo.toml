[package]
name = "catgraph-surreal"
version = "0.1.0"
edition = "2024"
# Measured, not guessed: the cross-feature maximum over the resolved dependency
# graph (see README "MSRV"). Re-measure whenever a dependency moves.
rust-version = "1.94"
license = "MIT"
description = "SurrealDB persistence for catgraph's category-theoretic structures"
repository = "https://github.com/sustia-llc/catgraph-surreal"
readme = "README.md"
keywords = ["surrealdb", "category-theory", "cospan", "persistence"]
categories = ["database"]
# The catgraph dependencies are git-tag sources, which crates.io forbids in a
# published package. The crate is public-but-unpublished by design (it exists so
# downstream CI can fetch it over HTTPS), so publishing is turned off rather than
# left to fail at `cargo publish` time.
publish = false

[features]
# RocksDB is the primary durable engine for this store.
default = ["rocksdb"]
# In-memory engine. Tests and correctness work only: conflict-retry tuning
# measured here does NOT transfer to the persistent engines, which have a
# different conflict surface.
mem = ["surrealdb/kv-mem"]
# Primary durable embedded engine.
rocksdb = ["surrealdb/kv-rocksdb"]
# SurrealKV. Documented beta for embedded use, with no durability soak history
# here — gated on that soak before it carries data whose loss would be silent.
kv = ["surrealdb/kv-surrealkv"]
# Server-tier client. BOTH transports on purpose: the capability split is real —
# HTTP grants Backup but no live queries, WS grants live queries but no Backup.
# A server-tier client that both checkpoints and subscribes needs both.
server = ["surrealdb/protocol-ws", "surrealdb/protocol-http"]
# Browser/edge engine.
wasm = ["surrealdb/kv-indxdb"]

[dependencies]
# `default-features = false` is load-bearing: the SDK's defaults pull
# protocol-ws + rustls into what would otherwise be a purely embedded build.
surrealdb = { version = "3.2.4", default-features = false }

# catgraph over the git tag via HTTPS, never a path dependency: an external
# consumer's CI has to be able to fetch this crate and its dependencies.
#
# `catgraph-dl` (without `serde` — weights persist as raw IEEE-754 bytes through
# the public `dim()`/`as_slice()`/`new()` surface) enters with the weight store;
# declaring it ahead of any use would make every consumer fetch and compile it
# for nothing.
catgraph = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.11.0" }

# The weight tier's payload type, `RModule<f64>`. `serde` is deliberately NOT
# enabled: coordinates are persisted as raw IEEE-754 bytes through the public
# `dim()`/`as_slice()`/`new()` surface, which is bit-exact where a JSON encoding
# is not — `serde_json` turns every non-finite into `null` on the way out and
# then fails to read it back. The crate declares no `default` feature, so
# `default-features = false` says what is meant rather than changing anything.
catgraph-dl = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.11.0", default-features = false }

# The term tier's payload type. `serde` is required — it is what puts
# `ColoredExpr`/`PropExpr` on the wire at all. `default-features = false` drops
# the `parallel` feature, whose rayon edge buys this crate nothing: the store
# does arity walks and hashing, not the linear-combination and Temperley-Lieb
# work those call sites accelerate, and the same dependency would have to build
# on every target this crate checks, wasm included.
catgraph-applied = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.11.0", default-features = false, features = [
    "serde",
] }

thiserror = "2"
serde = "1"
serde_json = "1"

# Content addressing. A term's identity is the digest of its canonical encoding,
# so this is on the write path of every stored term.
blake3 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The corrupt-document fixtures re-file tampered encodings under their own
# digests, so the address check (which runs first) passes and the later
# revalidation stages stay exercised.
blake3 = "1"
# Dev-only, and only to ENFORCE the mirror: `term::MAX_TERM_DEPTH` and
# `term::term_depth` re-implement this crate's originals (the store persists
# terms, it does not interpret them), and a test asserts the two stay in
# agreement so an upstream change fails CI instead of silently diverging.
catgraph-syntax = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.11.0", default-features = false }
# The canonical-key equivalence gate: `store_key(a) == store_key(b)` if and only
# if `a.canonical_form() == b.canonical_form()`, over generated cospans. Both
# directions matter, and neither is provable by a handful of examples.
proptest = "1"
# Dev-only, and for exactly one thing: `Cospan::new` bounds-checks under
# `debug_assert!`, so an out-of-bounds leg cannot be built through it in a test
# build. `add_boundary_node` checks nothing in any profile and takes an
# `Either` — which is the only way to exhibit the value this store's own
# bounds check exists to refuse.
either = "1"
